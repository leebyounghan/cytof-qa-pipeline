# Hard shift tasks — channel_scale perturbations for In-Panel Hard (Setting 2).
#
# Each entry defines a single (dataset, step, channel_scale) triple.
# Magnitudes are MULTIPLICATIVE FACTORS on raw (pre-arcsinh) signal:
#   raw'      = raw * factor
#   arcsinh'  = arcsinh(sinh(arcsinh) * factor)
# factor=1.0 is no perturbation; <1 dims, >1 brightens.
#
# Why multiplicative? Additive shifts in arcsinh space drive dim cells (raw≈0)
# into unphysical negative raw counts. Multiplicative on raw preserves dim
# populations near zero and rescales bright populations proportionally — which
# is how lot/antibody/instrument calibration drift actually behaves.
#
# Calibration: factor = exp(delta), where the underlying delta was empirically
# calibrated per (dataset, step) as
#   delta = clip(0.30 × |median(marker | high_classes) − median(marker | low_classes)|, ±1.0)
#   panel_global: delta = clip(0.20 × median(protein-channel IQR), 1.0)
# (target ~10-30% of cells crossing the gate boundary; cap keeps the
#  perturbation in the 'lot variability' regime.) factor range thus spans
#  exp(-1) ≈ 0.37 to exp(1) ≈ 2.72.
#
# Runtime semantics
#   1. Load the sample's parquet normally.
#   2. Apply the channel_scale (marker name → broadcast via meta.json[channels]).
#   3. Compute the target step's parent population via the standard parent filter.
#   4. Evaluate the step's classification on the rescaled expression columns.
#   5. GT labels are unchanged — tests robustness to calibration drift.
#
# Sentinel: scales may include `__all_protein_markers__: <factor>` which the
# loader (src/hard_shifts.py) expands to all channels with kind == "protein".
#
# Sample scope: each hard_id applies to all samples in the dataset's `test` split.

scenarios:
  lineage_dim:
    description: Aged-antibody / partial conjugation failure on lineage markers — dim staining of CD3/CD4/CD8/CD19/CD20
    rationale: Antibody lots degrade or partial conjugation reduces stain intensity. Per-task delta = clip(0.30 × |pos_med
      - neg_med|, ±1.0).
  ccr7_internalization:
    description: Surface CCR7 loss from freeze-thaw or cell activation during prep — pushes Naive/CM cells toward EM/EMRA
      gates
    rationale: 'CCR7 is famously labile: freeze-thaw cycles and any in-tube activation cause receptor internalization.'
  cd45ra_drift:
    description: CD45RA antibody lot brightness increase — over-estimates Naive and TEMRA populations
    rationale: CD45RA shows substantial lot-to-lot variability. Brighter staining inflates the CD45RA-positive gate.
  treg_marker_collapse:
    description: Intracellular Treg marker dim staining — Foxp3/CD25 down, CD127 up — collapses the Treg gate
    rationale: Foxp3 is intracellular and requires fix/perm; technical failures dim Foxp3+CD25 simultaneously.
  mono_subset_shift:
    description: CD16 channel drift — confounds monocyte subset (Classical/Intermediate/Patrolling) and Neutrophil/Eosinophil
      borders
    rationale: CD16 spillover or compensation residuals shift the boundary between CD16-low and CD16-high populations.
  dc_marker_drift:
    description: Dendritic-cell discriminator marker drift — CD11c dim, CD123 dim — confuses pDC vs mDC discrimination
    rationale: DC subset markers have narrower dynamic range than lineage markers; lot variability shifts the pDC/mDC border.
  bead_residual:
    description: Post-normalization bead intensity drift — bead population shifts down, polluting the real-cell gate at step
      1
    rationale: EQ4-bead normalization can leave residuals when beads aren't perfectly captured. Marker name 'Bead' broadcasts
      to all 4 bead mass channels (140Ce, 142Ce, 165Ho, 175Lu). CyTOF only.
  viability_drift:
    description: Viability dye drift from sample storage / freeze-thaw — Rh staining intensifies, more cells incorrectly look
      dead
    rationale: 103Rh-IDU staining intensity grows with extended storage and freeze-thaw cycles, pushing real live cells past
      the viability gate. Step 6 of CyTOF cohorts.
  panel_global:
    description: Whole-panel calibration drift — all protein channels +delta — simulates batch-level instrument calibration
      error
    rationale: CyTOF bead normalization residuals or flow cytometer compensation drift apply systematically. delta = clip(0.20
      × median(protein-channel IQR), 1.0).
