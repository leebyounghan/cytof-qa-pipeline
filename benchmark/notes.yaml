Vaccine:
  1:
    definition: |
      Cleanup1: the cell-event fraction retained after calibration-bead exclusion. Bead: calibration beads.
    rule:
      x_marker: Time
      y_marker: 140Ce_Bead
      regions:
      - [Cleanup1, Cleanup1]
      - [Bead, Bead]
    details: |
      This is calibration-bead versus cell-event separation, not a leukocyte-subtype decision. Ce bead signal supplies the relevant identity while Time records acquisition order. Cleanup1 means bead-excluded events, not proof that every retained event is live, intact, or a singlet.
  2:
    definition: |
      Cleanup2: the cell-event fraction retained by fitting-residual quality control.
    rule:
      x_marker: Time
      y_marker: Residual
      regions: unsupported
    details: |
      The parent has had calibration beads removed but is not yet guaranteed to contain only clean singlets. Residual is an ion-cloud fitting-quality variable used to exclude doublets, partial events, and acquisition artifacts; Time is acquisition context. A QC value must not be interpreted as a molecular positive/negative cell phenotype.
  3:
    definition: |
      Cleanup3: the cell-event fraction retained by ion-cloud-centering quality control.
    rule:
      x_marker: Time
      y_marker: Center
      regions: unsupported
    details: |
      The input has passed bead exclusion and fitting-residual cleanup. Center assesses ion-cloud centering and helps reject events without a well-formed acquisition profile. This is technical event-quality selection rather than a biological lineage label; Time does not define a cell type.
  4:
    definition: |
      Cleanup4: the cell-event fraction retained by baseline-offset quality control.
    rule:
      x_marker: Time
      y_marker: Offset
      regions: unsupported
    details: |
      Earlier cleanup does not by itself establish a normal event baseline. Offset addresses baseline-offset quality and acquisition artifacts, independently of the later cell-lineage decisions. Interpret it as a technical QC variable rather than a protein-expression marker.
  5:
    definition: |
      Cleanup5: the singlet-event fraction retained by ion-cloud-width quality control.
    rule:
      x_marker: Time
      y_marker: Width
      regions: unsupported
    details: |
      The parent has passed earlier acquisition-quality cleanup. Width supplies an additional technical check for wide-pulse doublets and aggregates; earlier QC acceptance is not proof of a single-cell event. No observed pulse-width range or sample-specific acceptance boundary is prescribed here.
  6:
    definition: |
      Cleanup6: the cell-event fraction retained by viability cleanup.
    rule:
      x_marker: Time
      y_marker: 103Rh_Live_Dead
      regions:
      - [Cleanup6, Cleanup6]
      - [Unassigned, Unassigned]
    details: |
      This is viability cleanup after earlier technical-event filtering. The Rh live/dead channel addresses dead-cell exclusion; passing bead and ion-cloud QC does not itself establish viability. Time is acquisition context, not a second viability marker.
  7:
    definition: |
      Ir: nucleated events.
    rule:
      x_marker: 191Ir_DNA1
      y_marker: Event_length
      regions:
      - [Unassigned, Ir]
      - [Unassigned, Ir]
    details: |
      The parent has passed technical and viability cleanup. Ir selects nucleated cell events through DNA1; it is not another live/dead decision. Event_length is displayed but is not a separate biological subtype definition at this step.
  8:
    definition: |
      CD45: all leukocytes, including granulocytes.
    rule:
      x_marker: 193Ir_DNA2
      y_marker: 89Y_CD45
      regions:
      - [Unassigned, Unassigned]
      - [Unassigned, CD45]
    details: |
      The parent is already DNA1-positive nucleated events, but that does not guarantee acceptable single-cell nuclear content. This leukocyte step also excludes doublets, damaged or hyperploid nuclear events, and non-cell/debris events using DNA2 context, while CD45 supplies leukocyte identity. Do not reduce the target to CD45 positivity alone; no sample-specific DNA2 acceptance range is supplied. On the CD45 axis, only CD45-negative events are excluded.
  9:
    definition: |
      Mononuclear: CD66b-negative CD45-high mononuclear leukocytes. Granulocyte: CD66b-positive CD45-intermediate granulocytes. CD66bnegCD45lo: the CD66b-negative CD45-low residual event fraction. CD45hiCD66bpos: the CD45-high CD66b-positive leukocyte fraction.
    rule:
      x_marker: 172Yb_CD66b
      y_marker: 89Y_CD45
      regions:
      - [CD66bnegCD45lo, Granulocyte]
      - [Mononuclear, CD45hiCD66bpos]
    details: |
      The parent is the retained leukocyte fraction. Mononuclear and Granulocyte name the main lineage compartments; the marker-coded residual and CD45-high/CD66b-positive fraction are additional explicit targets rather than cells to force into those two lineages. Preserve these panel annotation categories without inferring their proportions.
  10:
    definition: |
      CD14negCD56neg: the CD14/CD56 double-negative mononuclear fraction.
    rule:
      x_marker: 168Er_CD14
      y_marker: 163Dy_CD56_NCAM
