      The parent already excludes the main T/B fractions. This further cleanup removes NK-associated and residual B-associated events before monocyte and basophil/ILC processing. The retained NonBNonNK fraction remains heterogeneous and must not be equated with monocytes alone.
  17:
    definition: |
      TotalMonocyte: CD11c-positive monocytes, CD14-high to CD14-low, combining the monocyte subsets.
    rule:
