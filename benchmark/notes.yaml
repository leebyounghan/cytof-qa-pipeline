    oracle: |
      193Ir_DNA2 × 89Y_CD45 — leukocyte gate that simultaneously trims doublets and debris.
      Parent is already DNA1+ (intact-nucleus events from step 7); this step selects CD45+ leukocytes within that parent.
      **Critical scale note**: the CD45 island sits at MID-to-HIGH DNA2 AND LOW-to-HIGH CD45 — NOT at either axis extreme on the DNA2 axis, and spanning nearly the full CD45 range above the bottom floor strip.
      - CD45: leukocytes — dense oval island in the mid-to-high DNA2 / low-to-high CD45 region.
      Unassigned wraps the CD45 island on three sides:
        (a) extremely high-DNA2 right tail (doublets / damaged or hyperploid nuclei),
        (b) low-DNA2 left tail (debris / non-live),
        (c) low-CD45 bottom floor strip at CD45 ≈ 0 (non-immune events) — a distinct thin horizontal band beneath the island.
