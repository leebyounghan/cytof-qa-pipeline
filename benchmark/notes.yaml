    CD4TEMRA/activated: activated CD4 TEMRA cells — lower-right quadrant (HLA-DR+, CD38low). CD4TEMRA/CD38pos: proliferating CD4 TEMRA cells — upper-left quadrant (HLA-DR-, CD38+). CD4TEMRA/activated+CD38pos: dually activated and proliferating CD4 TEMRA cells — upper-right quadrant (both +). Three-quadrant HLA-DR × CD38 layout; the resting (HLA-DR-, CD38-) lower-left quadrant is excluded.

  49: |
    Aggregated activation status across all non-naive CD4 T cells (TCM + all TEM stages + TEMRA). nnCD4/activated: activated non-naive CD4 — lower-right quadrant (HLA-DR+, CD38low). nnCD4/CD38pos: proliferating non-naive CD4 — upper-left quadrant (HLA-DR-, CD38+). nnCD4/activated+CD38pos: dually activated and proliferating non-naive CD4 — upper-right quadrant (both +). Three-quadrant HLA-DR × CD38 layout; the resting (HLA-DR-, CD38-) lower-left quadrant is excluded.

  50: |
    nnCD4CXCR5pos: T follicular helper cells and Tfh-like cells (B-cell-follicle homing) — right band (CXCR5 high). nnCD4CXCR5neg: non-follicular non-naive helper T cells (parent for Th1/Th17/Th2 polarization downstream) — left band (CXCR5 low). Split along CXCR5.

  51: |
    nnCD4CXCR5pos/activated: activated Tfh / Tfh-like cells — lower-right quadrant (HLA-DR+, CD38low). nnCD4CXCR5pos/CD38pos: proliferating Tfh / Tfh-like cells — upper-left quadrant (HLA-DR-, CD38+). nnCD4CXCR5pos/activated+CD38pos: dually activated and proliferating Tfh / Tfh-like cells — upper-right quadrant (both +). Three-quadrant HLA-DR × CD38 layout; the resting (HLA-DR-, CD38-) lower-left quadrant is excluded.

  52: |
    Treg: regulatory T cells (memory/effector Treg only — corresponds to Miyara Fractions II/III; resting CD45RA+ Treg are in CD4Naive and not captured here) — cluster at the lower-right (CD25 high, CD127 low); the rest of the parent (CD25-low / CD127-high conventional T cells) is excluded.

  53: |
    Treg/activated: activated regulatory T cells — lower-right quadrant (HLA-DR+, CD38low). Treg/CD38pos: proliferating regulatory T cells — upper-left quadrant (HLA-DR-, CD38+). Treg/activated+CD38pos: dually activated and proliferating regulatory T cells — upper-right quadrant (both +). Three-quadrant HLA-DR × CD38 layout; the resting (HLA-DR-, CD38-) lower-left quadrant is excluded.

  54: |
    Th1: Type-1 helper T cells (IFNγ producers) — upper-left region (CCR6 low, CXCR3 high). Th17: Type-17 helper T cells (IL-17 producers; may include Th22-like cells) — lower-right region (CCR6 high, CXCR3 low). NonTh1NonTh17: non-Th1, non-Th17 effectors — Th2 candidates and uncommitted (Th2 resolved downstream) — lower-left region (both low). Three populations split by CCR6 × CXCR3 chemokine-receptor coordinates.

  55: |
    Th1/activated: activated Th1 cells — lower-right quadrant (HLA-DR+, CD38low). Th1/CD38pos: proliferating Th1 cells — upper-left quadrant (HLA-DR-, CD38+). Th1/activated+CD38pos: dually activated and proliferating Th1 cells — upper-right quadrant (both +). Three-quadrant HLA-DR × CD38 layout; the resting (HLA-DR-, CD38-) lower-left quadrant is excluded.

  56: |
    Th17/activated: activated Th17 cells — lower-right quadrant (HLA-DR+, CD38low). Th17/CD38pos: proliferating Th17 cells — upper-left quadrant (HLA-DR-, CD38+). Th17/activated+CD38pos: dually activated and proliferating Th17 cells — upper-right quadrant (both +). Three-quadrant HLA-DR × CD38 layout; the resting (HLA-DR-, CD38-) lower-left quadrant is excluded.

  57: |
    Th2: Type-2 helper T cells — right band (CCR4 high; CXCR3 stays low because the parent already excluded Th1). The CCR4-low cluster on the left is excluded.

  58: |
    Th2/activated: activated Th2 cells — lower-right quadrant (HLA-DR+, CD38low). Th2/CD38pos: proliferating Th2 cells — upper-left quadrant (HLA-DR-, CD38+). Th2/activated+CD38pos: dually activated and proliferating Th2 cells — upper-right quadrant (both +). Three-quadrant HLA-DR × CD38 layout; the resting (HLA-DR-, CD38-) lower-left quadrant is excluded.

  59: |
    DNT/activated: activated double-negative T cells — lower-right quadrant (HLA-DR+, CD38low). DNT/CD38pos: proliferating double-negative T cells — upper-left quadrant (HLA-DR-, CD38+). DNT/activated+CD38pos: dually activated and proliferating double-negative T cells — upper-right quadrant (both +). Three-quadrant HLA-DR × CD38 layout; the resting (HLA-DR-, CD38-) lower-left quadrant is excluded.

  60: |
    DPT/activated: activated double-positive T cells — lower-right quadrant (HLA-DR+, CD38low). DPT/CD38pos: proliferating double-positive T cells — upper-left quadrant (HLA-DR-, CD38+). DPT/activated+CD38pos: dually activated and proliferating double-positive T cells — upper-right quadrant (both +). Three-quadrant HLA-DR × CD38 layout; the resting (HLA-DR-, CD38-) lower-left quadrant is excluded.

  61: |
    MAITNKT: mucosal-associated invariant T cells and invariant NKT cells (unconventional T-cell populations within αβT) — small cluster at the upper-left (CD4 low, CD161 high); the broad CD4+ region on the right and the CD161-low background at the bottom are excluded.

  62: |
    Neutrophil: mature neutrophils — large dense blob at the lower-right (CD16 high, CD294 low). Eosinophil: eosinophils — dense blob at the upper-left (CD16 mid-to-low, CD294 high). Two populations sit on opposite corners with a clear diagonal separation.

FR-FCM-Z74D_hc:
  1: |
    CD4: helper T cells — lower-right quadrant (CD4+, CD8-). CD8: cytotoxic T cells — upper-left quadrant (CD4-, CD8+). CD4p_CD8p: double-positive T cells (rare; often thymic emigrants or activated transitional) — upper-right quadrant. CD4n_CD8n: double-negative T cells (includes γδT, MAIT, iNKT) — lower-left quadrant. Both CD4 and CD8 are bimodal — quadrant boundaries set at the valley between the positive and negative peaks of each axis.

  2: |
    Classical Sallusto/Lanzavecchia CD8 memory layout on CCR7 × CD45RA. Strategy: (1) Naive_CD8 anchors on the dense blob at the upper-right corner (CCR7 very high, CD45RA high) — antigen-inexperienced naive cytotoxic T cells. (2) EMRA_CD8 sits immediately to the left of Naive_CD8 in the upper CD45RA band — terminally differentiated cytotoxic T cells. (3) In the lower CD45RA band (memory cells), CCR7 is bimodal — locate the CCR7+ peak; CM_CD8 (central memory; lymph-node homing) sits at/right of this peak, EM_CD8 (effector memory) sits to its left. CCR7 (and sometimes CD45RA) can be trimodal in this panel, so density peaks — not fixed thresholds — anchor the gate.

  3: |
    Treg vs conventional CD4 split on Foxp3 × CD127. tot_Treg: total regulatory T cells (CD4 lineage) — distinct cluster at the right (Foxp3+) and toward the lower edge (CD127-low). non_Treg: conventional helper T cells (Treg-excluded CD4 pool; parent for downstream memory and Th-polarization steps) — broad cluster at the left (Foxp3 low/negative).

  4: |
    Classical Sallusto/Lanzavecchia CD4 non-Treg memory layout on CCR7 × CD45RA. Strategy: (1) Naive_CD4 anchors on the dense blob at the upper-right corner (CCR7 very high, CD45RA high) — antigen-inexperienced naive helper T cells. (2) EMRA_CD4 sits immediately to the left of Naive_CD4 in the upper CD45RA band (rare in CD4) — terminally differentiated helper T cells. (3) In the lower CD45RA band (memory cells), CCR7 is bimodal — locate the left edge / shoulder of the CCR7+ peak (where density rises from background); CM_CD4 (central memory; lymph-node homing) sits at/right of this edge (includes the dense CCR7+ peak), EM_CD4 (effector memory) sits to its left. CCR7 (and sometimes CD45RA) can be trimodal in this panel, so density peaks — not fixed thresholds — anchor the gate. Memory subsets (CM, EM, EMRA) feed downstream Tfh annotation.

  5: |
    Strategy on CXCR5 × PD-1 — three populations stacked vertically within the CXCR5+ right cluster, plus the entire CXCR5- bulk: (1) CXCR5 is bimodal — locate the dense CXCR5+ cluster on the right. (2) Within the CXCR5+ cluster, find the PD-1 density peak. Tfh (resting / circulating Tfh) occupies the band from the PD-1 peak upward; Tfh_hi_PD1 (activated germinal-center-like Tfh) is the top sliver above this band (PD-1 very high). (3) non_Tfh (non-follicular memory helper T cells) = the entire CXCR5- left cluster PLUS the events in the CXCR5+ right cluster that sit BELOW the PD-1 peak.

  6: |
    Chemokine-receptor-based Th polarization on non-Tfh memory CD4 (CXCR3 × CCR6). Th1: Type-1 helper T cells (IFNγ producers; this gate also absorbs the plastic Th1/17 'Th1*' subset) — right region (CXCR3+, any CCR6). Th17_22: IL-17 / IL-22 producing Th cells — upper-left quadrant (CXCR3-, CCR6+). non_17_22_1: Th2 candidates and uncommitted effectors — lower-left quadrant (both CXCR3- and CCR6-).

  7: |
    Splitting the CCR6+ compartment on CCR10 × CCR4. Th17: classical IL-17-producing Th17 cells — upper-left cluster (CCR10-, CCR4+). Th22: IL-22-producing Th22 cells (skin-homing) — right cluster (CCR10+, CCR4+). The lower-left double-negative (CCR4-, CCR10-) corner is unassigned.

  8: |
    Th2 identification within the CXCR3- CCR6- compartment. Th2: Type-2 helper T cells — right cluster (CCR4+); the CCR4-low cluster on the left is unassigned. CCR4 is bimodal — boundary set at the valley between the CCR4- and CCR4+ peaks. CD8 (y) is a purity sanity-check axis (parent is CD4+ CD8-, so events stay at CD8-low); the call is driven by CCR4.

  9: |
    Strategy on CD127 × PD-1: (1) Find the dense CD127+ cluster on the right; events at CD127 below the left edge of this cluster (a sparse, scattered CD127- region) form the CD127- side. (2) Within the CD127+ cluster, locate the PD-1 density peak — use it as the horizontal threshold. Above the PD-1 peak = Th1_CD127p_PD1p (recently activated, still memory-competent Th1; upper-right). Below the PD-1 peak = Th1_CD127p_PD1n (resting homeostatic memory Th1; lower-right, the dominant population). (3) Apply the same PD-1 threshold to the sparse CD127- region: above the threshold = Th1_CD127n_PD1p (chronically-activated effector Th1; upper-left); below the threshold = Th1_CD127n_PD1n (terminally differentiated / post-effector Th1; lower-left). Parent caveat: this Th1 compartment includes the plastic CXCR3+CCR6+ Th1/17 subset.

  10: |
    Treg lineage stratification by Helios on Helios × Foxp3. Treg_Heliosp: stable-lineage Treg (enriched for thymus-derived Treg) — right cluster (Helios+). Treg_Heliosn: peripherally-induced or less-stable Treg — left cluster (Helios-). Helios is bimodal — boundary set at the valley between the two peaks. Foxp3 (y) is a parent-gate visual QC only (parent already Foxp3+, events stay at Foxp3-high).

  11: |
    Treg memory / activation status on CCR7 × CD45RA, binary split (CM/EM/EMRA collapsed into a single 'Memory_Treg' bucket). Naive_Treg: resting naive Treg (Miyara Fraction I) — upper-right quadrant (CCR7+, CD45RA+). Memory_Treg: effector / activated Treg (Miyara Fractions II + III aggregated) — broad cluster across the other three quadrants.

  12: |
    Strategy on CCR4 × CD69 — anchor on the two dense CD69- clusters: (1) In the lower (CD69-) band, two dense clusters separate along CCR4 — the left dense cluster (CCR4-) is Treg_CCR4n_CD69n (resting non-skin-homing Treg); the right dense cluster (CCR4+) is Treg_CCR4p_CD69n (skin-homing Treg, not activated). (2) Above these dense clusters the CD69+ region is sparse and scattered; apply the same CCR4 boundary: left of the boundary = Treg_CCR4n_CD69p (activated Treg without skin-homing bias); right of the boundary = Treg_CCR4p_CD69p (activated skin-homing Treg).

