Acute2021:
  1:
    definition: |
      Cleanup1: the cell-event fraction retained after calibration-bead exclusion. Bead: calibration beads.
    rule:
      x_marker: Time
      y_marker: 140Ce_Bead
      regions:
      - [Cleanup1, Cleanup1]
      - [Bead, Bead]
    details: |
      This is calibration-bead versus cell-event separation, not a leukocyte-subtype decision. Ce bead signal supplies the relevant identity while Time records acquisition order. Cleanup1 means bead-excluded events, not proof that every retained event is live, intact, or a singlet.
  2:
    definition: |
      Cleanup2: the cell-event fraction retained by fitting-residual quality control.
    rule:
      x_marker: Time
      y_marker: Residual
      regions: unsupported
    details: |
      The parent has had calibration beads removed but is not yet guaranteed to contain only clean singlets. Residual is an ion-cloud fitting-quality variable used to exclude doublets, partial events, and acquisition artifacts; Time is acquisition context. A QC value must not be interpreted as a molecular positive/negative cell phenotype.
  3:
    definition: |
      Cleanup3: the cell-event fraction retained by ion-cloud-centering quality control.
    rule:
      x_marker: Time
      y_marker: Center
      regions: unsupported
    details: |
      The input has passed bead exclusion and fitting-residual cleanup. Center assesses ion-cloud centering and helps reject events without a well-formed acquisition profile. This is technical event-quality selection rather than a biological lineage label; Time does not define a cell type.
  4:
    definition: |
      Cleanup4: the cell-event fraction retained by baseline-offset quality control.
    rule:
      x_marker: Time
      y_marker: Offset
      regions: unsupported
    details: |
      Earlier cleanup does not by itself establish a normal event baseline. Offset addresses baseline-offset quality and acquisition artifacts, independently of the later cell-lineage decisions. Interpret it as a technical QC variable rather than a protein-expression marker.
  5:
    definition: |
      Cleanup5: the singlet-event fraction retained by ion-cloud-width quality control.
    rule:
      x_marker: Time
      y_marker: Width
      regions: unsupported
    details: |
      The parent has passed earlier acquisition-quality cleanup. Width supplies an additional technical check for wide-pulse doublets and aggregates; earlier QC acceptance is not proof of a single-cell event. No observed pulse-width range or sample-specific acceptance boundary is prescribed here.
  6:
    definition: |
      Cleanup6: the cell-event fraction retained by viability cleanup.
    rule:
      x_marker: Time
      y_marker: 103Rh_Live_Dead
      regions:
      - [Cleanup6, Cleanup6]
      - [Unassigned, Unassigned]
    details: |
