# Per-cohort, per-step category definitions, region rules, and parent/preprocessing context.
#
# definition: cell/category-name meanings only. Marker-coded names are expanded
# literally where needed; no additional two-axis phenotype or gate geometry is given.
# rule: the existing x_marker, y_marker, and regions mapping, kept unchanged.
# heuristic: context derived only from explicit upstream gating conditions and
# documented preprocessing. No current-step distribution observations are included.
# Parent conditions come from panel_meta.yaml and are checked against task.json.
# Lyoplate transforms come from its dataset_config.yaml and documented converter.
# Other cohorts report prepared-input/cofactor metadata without assuming an
# unverified per-channel transform. No GT counts, proportions, modes, positions,
# rarity assumptions, or boundary-placement strategies are used in heuristic.
# Definition-only prompts use definition; context-assisted prompts add heuristic.
# Rule-based systems use rule directly. All content is in English.
#
# Marker and category identifiers in rule match benchmark task.json exactly.
# Supply sorted valley values in the same units as the prepared axis values.
# rule.regions[y_bin][x_bin] is the category; rows/columns run low to high.
# Bin index = number of valleys strictly below the event value; equality stays
# in the lower bin. An R-by-C table needs R-1 y valleys and C-1 x valleys.
# No valley-selection rule is given. Repeated labels merge regions.
# Unassigned is an explicit category. regions: unsupported requires an error.
# Missing/invalid valleys or an incorrect valley count must also cause an error.

Bjornson:
  1:
    definition: |
      Ir: nucleated events; this name does not by itself establish viability.
    rule:
      x_marker: DNA1
      y_marker: Event_length
      regions:
      - [Unassigned, Ir]
      - [Unassigned, Ir]
    heuristic: |
      Parent: ALL, meaning all events available to this benchmark task. No additional upstream gate is specified in this cohort gating plan; ALL does not imply raw, unprocessed acquisition events.
      Preprocessing: benchmark tasks consume prepared parquet channel values; cohort arcsinh cofactor metadata is 5. The cofactor is not a positivity threshold. No unverified per-channel transform or numeric cutoff is assumed here.
      Use the prepared coordinate system; parent filtering does not imply that negative labels occur at zero or specify where a positive/negative boundary lies.
  2:
    definition: |
      CD45: leukocytes, or white blood cells.
    rule:
      x_marker: DNA2
      y_marker: CD45_In115Di
      regions:
      - [Unassigned, Unassigned]
      - [Unassigned, CD45]
    heuristic: |
      Parent condition: Step01_DNA1|Event_length == Ir.
      These are inherited annotation memberships, not assertions about marker coordinates or distribution shape.
      Preprocessing: benchmark tasks consume prepared parquet channel values; cohort arcsinh cofactor metadata is 5. The cofactor is not a positivity threshold. No unverified per-channel transform or numeric cutoff is assumed here.
      Use the prepared coordinate system; parent filtering does not imply that negative labels occur at zero or specify where a positive/negative boundary lies.
  3:
