      Th17/activated: the activation-associated HLA-DR single-positive fraction of type-17 helper T cells. Th17/CD38pos: the CD38 single-positive fraction of type-17 helper T cells. Th17/activated+CD38pos: the HLA-DR/CD38 double-positive fraction of type-17 helper T cells.
