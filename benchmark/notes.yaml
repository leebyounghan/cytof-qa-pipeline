    details: |
      The parent has undergone T/B and NK/residual-B cleanup. TotalMonocyte combines classical, intermediate, and non-classical monocytes rather than selecting a CD14-high subset only. CD14 can distinguish later monocyte subsets; do not use the parent-cleanup label alone as proof of monocyte identity.
  18:
    definition: |
      ClassicalMono: CD14-high CD38-high classical monocytes. TransitionalMono: CD14-intermediate CD38-intermediate monocytes. NonclassicalMono: CD14-low CD38-low non-classical monocytes.
