      The parent is the combined monocyte fraction. ClassicalMono, TransitionalMono, and NonclassicalMono are this panel's three monocyte annotations, with TransitionalMono denoting intermediate monocytes. CD38/CD14 is the displayed panel-specific phenotyping combination, not an instruction to infer maturation identity from acquisition quality or from the preceding cleanup labels.
  19:
    definition: |
      Basophil: HLA-DR-negative CD123-high basophils. HLADRloCD123lo: the HLA-DR-low CD123-low residual fraction.
    rule:
