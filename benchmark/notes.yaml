# Per-cohort, per-step category definitions, region rules, and curated contextual hints.
#
# definition: cell/category-name meanings, including explicit panel-specific label
# conventions where needed. rule: the existing region mapping, kept unchanged.
# details: useful context curated from the original notes and checked against
# the parent gating plan and documented preprocessing. Explain what inherited
# selection means for the current decision, rather than dumping parent expressions.
# Retain workflow purpose, target inclusion/exclusion semantics, technical-channel
# meaning, and relevant prepared-coordinate cautions. Do not provide observed
# cluster positions, densities, proportions, rarity, quantiles, or boundary-placement
# strategies. Context and annotation semantics are not independent biological validation.
# Definition-only prompts use definition; context-assisted prompts add details.
# Rule-based systems use rule directly. All content is in English.
#
# Marker/category identifiers in rule match benchmark task.json exactly.
# Supply sorted valley values in the same units as the prepared axis values.
# rule.regions[y_bin][x_bin] is the category; rows/columns run low to high.
# Bin index = number of valleys strictly below the event value; equality stays
# in the lower bin. An R-by-C table needs R-1 y valleys and C-1 x valleys.
# No valley-selection rule is given. Repeated labels merge regions.
# Unassigned is an explicit category. regions: unsupported requires an error.
# Missing/invalid valleys or an incorrect valley count must also cause an error.

Bjornson:
  1:
    definition: |
      Ir: nucleated events.
    rule:
      x_marker: DNA1
      y_marker: Event_length
      regions:
      - [Unassigned, Ir]
      - [Unassigned, Ir]
    details: |
      Nucleated cells form the bright DNA1 population; lower DNA1 modes are debris or non-nucleated events.
  2:
    definition: |
      CD45: all leukocytes, including granulocytes.
    rule:
      x_marker: DNA2
      y_marker: CD45_In115Di
      regions:
      - [Unassigned, Unassigned]
      - [Unassigned, CD45]
    details: |
      The parent has already passed DNA1-based nucleated-event selection. This leukocyte step also rejects doublets and damaged or hyperploid nuclear events using DNA2; nuclear signal alone is not sufficient for acceptance. Keep the leukocyte identity and the abnormal-nuclear-event exclusion conceptually separate. On the CD45 axis, only CD45-negative events are excluded.
  3:
    definition: |
      Granulocyte: CD66-high CD45-intermediate granulocytes. CD45hiCD66lo: CD45-high CD66-low mononuclear leukocytes.
    rule:
      x_marker: CD66_Gd158Di
      y_marker: CD45_In115Di
      regions:
      - [Unassigned, Granulocyte]
      - [CD45hiCD66lo, Granulocyte]
    details: |
      The parent is the retained leukocyte fraction. Granulocyte requires CD66 positivity without an additional CD45 requirement. CD45hiCD66lo requires low CD66 together with CD45 positivity; despite its name, it does not require a separate CD45-high subset. CD66-low/CD45-negative residuals are not assigned to that mononuclear label.
  4:
    definition: |
      Bcells: CD19-positive CD3-negative B lymphocytes. Tcells: CD3-positive CD19-negative T lymphocytes. CD3negCD19neg: CD3-negative CD19-negative non-B, non-T cells.
    rule:
      x_marker: CD3_Gd157Di
      y_marker: CD19_Yb173Di
      regions:
      - [CD3negCD19neg, Tcells]
      - [Bcells, Unassigned]
    details: |
      The parent is the mononuclear leukocyte fraction. The CD3/CD19 double-negative label is a legitimate non-B, non-T compartment, not merely uncertainty between B and T identities. Negative annotation labels do not require zero-valued expression on the prepared axes.
  5:
    definition: |
      CD4Tcells: CD4-positive CD8-negative helper T cells. CD8Tcells: CD8-positive CD4-negative cytotoxic T cells.
    rule:
      x_marker: CD4_Gd156Di
      y_marker: CD8_Gd155Di
      regions:
      - [Unassigned, CD4Tcells]
      - [CD8Tcells, Unassigned]
    details: |
      The parent is already T cells. This step names only helper and cytotoxic T cells; CD4/CD8 double-positive and double-negative T-cell fractions are outside the two named targets and remain Unassigned.
  6:
    definition: |
      NKcells: CD7-positive HLA-DR-negative natural killer cells. HLA-DRposCD7neg: HLA-DR-positive CD7-negative antigen-presenting cells.
    rule:
      x_marker: CD7_Pr141Di
      y_marker: HLA-DR_Yb176Di
      regions:
      - [Unassigned, NKcells]
      - [HLA-DRposCD7neg, Unassigned]
    details: |
      The parent is the non-B, non-T residual. This branch distinguishes NK cells from antigen-presenting cells, rather than repeating B/T selection. The CD7-negative/HLA-DR-negative residual, which can include basophil candidates, is outside the named NK/APC targets.
  7:
    definition: |
      Monocytes: CD11b-positive monocytes, CD16-negative (classical) to CD16-positive (non-classical). CD11bnegCD16neg: CD11b-negative CD16-negative residual cells.
    rule:
      x_marker: CD16_Tb159Di
      y_marker: CD11b_Eu153Di
      regions:
      - [CD11bnegCD16neg, Unassigned]
      - [Monocytes, Monocytes]
    details: |
      The parent is the antigen-presenting-cell branch of the non-B, non-T compartment. Monocytes is a combined monocyte label, not a CD16-defined monocyte subset: CD16 expression alone should not split this target. The CD11b/CD16 double-negative residual is kept separate for the downstream DC branch.
  8:
    definition: |
      DCs: cDC + pDC; CD11c-positive CD123-low conventional DCs plus CD11c-negative CD123-high plasmacytoid DCs.
    rule:
      x_marker: CD11c_Nd143Di
      y_marker: CD123_Nd148Di
      regions:
      - [Unassigned, DCs]
      - [DCs, Unassigned]
    details: |
      Union of cDC (CD11c⁺CD123⁻) and pDC (CD11c⁻CD123⁺).
Lyoplate_bcell:
  1:
    definition: |
      CD19pos: CD19⁺CD3⁻ B-lineage cells. CD3pos: CD3⁺CD19⁻ T-lineage cells.
    rule:
      x_marker: CD3
      y_marker: CD19
      regions:
      - [Unassigned, CD3pos]
      - [CD19pos, Unassigned]
    details: |
      This entry step identifies B-lineage and T-lineage cells, not B-cell maturation subsets. The CD3/CD19 double-negative fraction is not a third named lineage target here and remains Unassigned.
  2:
    definition: |
      CD19_CD20pos: the CD20-expressing B-lineage fraction. CD19_CD20neg: the B-lineage fraction designated as CD20 negative.
    rule:
      x_marker: CD3
      y_marker: CD20
      regions:
      - [CD19_CD20neg, Unassigned]
      - [CD19_CD20pos, Unassigned]
    details: |
      The parent is already the B-lineage fraction selected by CD19 in the CD3/CD19 split. CD3 supplies lineage context rather than a new B-cell-subtype identity; CD20 distinguishes the two B-lineage labels. Interpret CD20-negative as the annotation's low/negative fraction within that parent, not a demand for a value of zero after the documented arcsinh transformation.
  3:
    definition: |
      Naive: IgD⁺CD27⁻ naive B cells. Memory_IgDpos: IgD⁺CD27⁺ non-switched memory B cells. Memory_IgDneg: IgD⁻CD27⁺ IgD-negative (switched) memory B cells. IgDneg_CD27neg: IgD⁻CD27⁻ double-negative B cells.
    rule:
      x_marker: IgD
      y_marker: CD27
      regions:
      - [IgDneg_CD27neg, Naive]
      - [Memory_IgDneg, Memory_IgDpos]
    details: |
      The parent is the CD20-expressing B-cell fraction, not all input lymphocytes. IgD and CD27 distinguish naive, non-switched memory, IgD-negative memory, and double-negative B-cell categories. The double-negative label is a named B-cell compartment and must not be collapsed into Unassigned. Prepared expression values do not make negative equivalent to axis zero.
  4:
    definition: |
      Transitional: CD24-high CD38-high transitional B cells.
    rule:
      x_marker: CD38
      y_marker: CD24
      regions:
      - [Unassigned, Unassigned]
      - [Unassigned, Transitional]
    details: |
      Transitional is an immature B-cell target within the CD20-expressing B-cell parent. Joint CD38/CD24 phenotype is relevant to this identity; neither marker alone should make every remaining B cell transitional. The remainder of the parent is not another named category at this step.
  5:
    definition: |
      Plasmablasts: CD27-high CD38-high antibody-secreting B-lineage cells.
    rule:
      x_marker: CD38
      y_marker: CD27
      regions:
      - [Unassigned, Unassigned]
      - [Unassigned, Plasmablasts]
    details: |
      The parent is the CD20-low/negative B-lineage residual, not the mature CD20-expressing B-cell pool. Plasmablasts denotes an antibody-secreting target within that residual, rather than a synonym for the entire parent. Use the joint CD38/CD27 phenotype; upstream B-lineage membership alone is insufficient.
Lyoplate_DC:
  1:
    definition: |
      Lin_neg_CD14pos: Lineage⁻CD14⁺ monocytes. Lin_neg_CD14neg: Lineage⁻CD14⁻ non-monocyte cells.
    rule:
      x_marker: CD14
      y_marker: Lineage
      regions:
      - [Lin_neg_CD14neg, Lin_neg_CD14pos]
      - [Unassigned, Unassigned]
    details: |
      These labels select lineage-negative fractions and then distinguish monocyte from non-monocyte candidates by CD14. Lin_neg_CD14neg is a candidate pool for subsequent NK/DC processing, not a claim that every cell in it is already a dendritic cell. Lineage-positive events are outside both named targets.
  2:
    definition: |
      CD14pos_CD16pos: the CD16-expressing monocyte fraction.
    rule:
      x_marker: CD11c
      y_marker: CD16
      regions:
      - [Unassigned, Unassigned]
      - [Unassigned, CD14pos_CD16pos]
    details: |
      The parent is the lineage-negative, CD14-positive monocyte fraction. CD14pos_CD16pos includes the CD16-expressing monocyte fraction without resolving intermediate from non-classical monocytes. CD11c provides myeloid context; CD14 selection by itself must not be interpreted as proof of a particular CD11c expression value.
  3:
    definition: |
      CD16neg_CD56pos: the NK-cell fraction designated as CD16 negative and CD56 positive. CD16pos_CD56pos: the NK-cell fraction designated as CD16 positive and CD56 positive. CD16pos_CD56neg: the CD16-positive, CD56-negative cell fraction. CD16neg_CD56neg: the CD16/CD56 double-negative residual cell fraction.
    rule:
      x_marker: CD16
      y_marker: CD56
      regions:
      - [CD16neg_CD56neg, CD16pos_CD56neg]
      - [CD16neg_CD56pos, CD16pos_CD56pos]
    details: |
      The parent is the lineage-negative, CD14-negative candidate compartment. CD16/CD56 double-negative cells are an explicitly named residual used by the DC branch, not automatically unclassifiable cells. The CD16-positive/CD56-negative label is marker-defined and does not by itself establish a unique NK-cell identity. Negative labels refer to the annotation phenotype, not a requirement for zero expression.
  4:
    definition: |
      HLADRpos: the HLA-DR-expressing antigen-presenting cell fraction.
    rule:
      x_marker: SSC-A
      y_marker: HLADR
      regions:
      - [Unassigned, Unassigned]
      - [HLADRpos, HLADRpos]
    details: |
      The parent has already excluded the CD16/CD56-positive NK-like fractions from the lineage-negative, CD14-negative compartment. HLA-DR selection enriches APC/DC candidates; it does not distinguish final DC subtypes. SSC-A is a scatter context axis, and its documented clipped/rescaled coordinate is not a second molecular positivity label.
  5:
    definition: |
      pDC: CD123-high CD11c-low/negative plasmacytoid dendritic cells. mDC: CD11c-high CD123-low myeloid or conventional dendritic cells. CD11cpos_CD123pos: the CD11c/CD123 double-positive cell fraction. CD11cneg_CD123neg: the CD11c/CD123 double-negative cell fraction. These marker-coded names are annotation labels, not independent validation of cell identity.
    rule:
      x_marker: CD11c
      y_marker: CD123
      regions:
      - [CD11cneg_CD123neg, mDC]
      - [pDC, CD11cpos_CD123pos]
    details: |
      Interpret the DC labels within the HLA-DR-expressing, lineage-negative, CD14-negative, CD16/CD56-double-negative parent. The marker-coded double-positive and double-negative fractions are explicit targets alongside pDC and mDC. They should not be forced into a canonical DC identity merely to exhaust the named categories. Parent selection and transformed coordinates alone do not establish absolute CD11c/CD123 cutoffs.
Lyoplate_tcell:
  1:
    definition: |
      CD3pos: CD3⁺ T lymphocytes.
    rule:
      x_marker: CD3
      y_marker: SSC-A
      regions:
      - [Unassigned, CD3pos]
      - [Unassigned, CD3pos]
    details: |
      This step selects T-lineage cells; it does not yet distinguish CD4, CD8, or unconventional T-cell subsets. SSC-A supplies scatter context rather than a molecular subtype label. The documented scatter rescaling means its coordinate zero is a preprocessing endpoint, not a biological absence state.
  2:
    definition: |
      CD4: CD4⁺CD8⁻ helper T cells. CD8: CD4⁻CD8⁺ cytotoxic T cells. DNT: CD4⁻CD8⁻ double-negative T cells. DPT: CD4⁺CD8⁺ double-positive T cells.
    rule:
      x_marker: CD4
      y_marker: CD8
      regions:
      - [DNT, CD4]
      - [CD8, DPT]
    details: |
      The parent is already CD3-expressing T cells. DNT and DPT refer to CD4/CD8 double-negative and double-positive T-cell fractions, respectively; DNT does not mean non-T cells. All four are named targets. Positive/negative annotations should not be equated with raw zero/nonzero values or fixed quantiles of this parent.
  3:
    definition: |
      CD4_Naive: CCR7⁺CD45RA⁺ naive helper T cells. CD4_Central_Memory: CCR7⁺CD45RA⁻ central memory helper T cells. CD4_Effector_Memory: CCR7⁻CD45RA⁻ effector memory helper T cells. CD4_Effector: CCR7⁻CD45RA⁺ CD45RA-reexpressing effector memory helper T cells (TEMRA).
    rule:
      x_marker: CCR7
      y_marker: CD45RA
      regions:
      - [CD4_Effector_Memory, CD4_Central_Memory]
      - [CD4_Effector, CD4_Naive]
    details: |
      Memory differentiation is assessed within helper T cells, rather than across the whole T-cell sample. CD4_Effector is this panel's shorthand for the CD45RA-reexpressing effector-memory category (TEMRA), not a generic label for every activated helper T cell. Differentiation status and activation status are separate annotations.
  4:
    definition: |
      CD4_Activated: the CD38/HLA-DR double-positive helper T-cell fraction. CD4_38negDRpos: the CD38-negative, HLA-DR-positive helper T-cell fraction. CD4_38posDRneg: the CD38-positive, HLA-DR-negative helper T-cell fraction. CD4_38negDRneg: the CD38/HLA-DR double-negative helper T-cell fraction.
    rule:
      x_marker: CD38
      y_marker: HLADR
      regions:
      - [CD4_38negDRneg, CD4_38posDRneg]
      - [CD4_38negDRpos, CD4_Activated]
    details: |
      The parent is helper T cells. These are CD38/HLA-DR expression categories, separate from the CCR7/CD45RA differentiation labels applied to the same parent. The double-negative resting fraction is explicitly named, not an Unassigned default. A differentiation label alone does not determine the activation category.
  5:
    definition: |
      CD8_Naive: CCR7⁺CD45RA⁺ naive cytotoxic T cells. CD8_Central_Memory: CCR7⁺CD45RA⁻ central memory cytotoxic T cells. CD8_Effector_Memory: CCR7⁻CD45RA⁻ effector memory cytotoxic T cells. CD8_Effector: CCR7⁻CD45RA⁺ CD45RA-reexpressing effector memory cytotoxic T cells (TEMRA).
    rule:
      x_marker: CCR7
      y_marker: CD45RA
      regions:
      - [CD8_Effector_Memory, CD8_Central_Memory]
      - [CD8_Effector, CD8_Naive]
    details: |
      Memory differentiation is assessed within cytotoxic T cells. CD8_Effector denotes the CD45RA-reexpressing effector-memory category (TEMRA), not all activated CD8 cells. Apply the same category meanings as the CD4 memory branch without importing assumptions about which subset is most common.
  6:
    definition: |
      CD8_Activated: the CD38/HLA-DR double-positive cytotoxic T-cell fraction. CD8_38negDRpos: the CD38-negative, HLA-DR-positive cytotoxic T-cell fraction. CD8_38posDRneg: the CD38-positive, HLA-DR-negative cytotoxic T-cell fraction. CD8_38negDRneg: the CD38/HLA-DR double-negative cytotoxic T-cell fraction.
    rule:
      x_marker: CD38
      y_marker: HLADR
      regions:
      - [CD8_38negDRneg, CD8_38posDRneg]
      - [CD8_38negDRpos, CD8_Activated]
    details: |
      The parent is cytotoxic T cells. CD38/HLA-DR expression categories are distinct from the memory-differentiation categories assigned to the same parent. The double-negative fraction is an explicit output label, and being naive or memory does not by itself determine one of these activation labels.
Lyoplate_treg:
  1:
    definition: |
      CD3pos: CD3⁺ T lymphocytes.
    rule:
      x_marker: CD3
      y_marker: SSC-A
      regions:
      - [Unassigned, CD3pos]
      - [Unassigned, CD3pos]
    details: |
      This is T-lineage selection before helper-T and regulatory-T selection. It does not label Tregs directly. SSC-A is a scatter context axis whose documented rescaling does not define a molecular negative/positive threshold.
  2:
    definition: |
      CD4pos: CD3⁺CD4⁺ helper T cells.
    rule:
      x_marker: CD3
      y_marker: CD4
      regions:
      - [Unassigned, Unassigned]
      - [Unassigned, CD4pos]
    details: |
      The parent has already been selected as CD3-expressing T cells. The new target is the helper-T fraction identified through CD4; the displayed CD3 axis carries inherited lineage context. CD8 and other non-helper T-cell branches are not additional named targets in this panel step.
  3:
    definition: |
      Treg: CD25-high CD127-low regulatory T cells.
    rule:
      x_marker: CD25
      y_marker: CD127
      regions:
      - [Unassigned, Treg]
      - [Unassigned, Unassigned]
    details: |
      Treg identification is restricted to the helper-T parent. Interpret the CD25-high/CD127-low phenotype in that context; low/negative annotation does not require a zero-valued prepared signal. The rest of the helper-T parent is not a second named target at this step.
  4:
    definition: |
      CCR4neg_HLADRpos: the CCR4-negative, HLA-DR-positive regulatory T-cell fraction. CCR4pos_HLADRpos: the CCR4/HLA-DR double-positive regulatory T-cell fraction. CCR4pos_HLADRneg: the CCR4-positive, HLA-DR-negative regulatory T-cell fraction. CCR4neg_HLADRneg: the CCR4/HLA-DR double-negative regulatory T-cell fraction.
    rule:
      x_marker: CCR4
      y_marker: HLADR
      regions:
      - [CCR4neg_HLADRneg, CCR4pos_HLADRneg]
      - [CCR4neg_HLADRpos, CCR4pos_HLADRpos]
    details: |
      The parent is already the regulatory T-cell fraction. CCR4/HLA-DR combinations subdivide that parent; this is not another regulatory-versus-conventional T-cell decision. All four combinations are named, including the double-negative fraction. The transformed axis origin is not itself a positivity control.
  5:
    definition: |
      CCR4neg_CD45ROpos: the CCR4-negative, CD45RO-positive regulatory T-cell fraction. CCR4pos_CD45ROpos: the CCR4/CD45RO double-positive regulatory T-cell fraction. CCR4pos_CD45ROneg: the CCR4-positive, CD45RO-negative regulatory T-cell fraction. CCR4neg_CD45ROneg: the CCR4/CD45RO double-negative regulatory T-cell fraction.
    rule:
      x_marker: CCR4
      y_marker: CD45RO
      regions:
      - [CCR4neg_CD45ROneg, CCR4pos_CD45ROneg]
      - [CCR4neg_CD45ROpos, CCR4pos_CD45ROpos]
    details: |
      The parent is already regulatory T cells. CCR4/CD45RO combinations describe additional homing/memory phenotypes within that parent, rather than redefining Treg identity. All four combinations are named. The low/negative designation is an annotation distinction, not an assertion that transformed expression must vanish.
FRDR_covid19:
  1:
    definition: |
      Time_stable: events retained as acquisition-stable events.
    rule:
      x_marker: Time
      y_marker: Comp-APC-A
      regions: unsupported
    details: |
      Time_stable is an acquisition-quality target, not a CD1c-defined cell type. Its purpose is to retain acquisition-stable events while excluding drift, fluid disturbances, and channel-stability artifacts. Interpret CD1c together with acquisition time; CD1c expression alone does not establish temporal stability.
  2:
    definition: |
      Cells: intact white blood cells.
    rule:
      x_marker: FSC-A
      y_marker: SSC-A
      regions: unsupported
    details: |
      The input has passed acquisition-stability selection. Cells is an inclusive intact-white-blood-cell target that includes lymphocytes, monocytes, and granulocytes; it is not a lymphocyte-only scatter gate. Debris and saturation artifacts are excluded. FSC-A/SSC-A describe scatter properties, not two binary molecular phenotypes.
  3:
    definition: |
      Singlets1: single-cell events retained by the first singlet-selection step.
    rule:
      x_marker: SSC-H
      y_marker: SSC-A
      regions: unsupported
    details: |
      The parent contains events retained as intact cells. Singlets1 rejects doublets and aggregates using consistency between SSC pulse height and pulse area. A normal cell-scatter identity does not itself establish a single-cell event. Pulse consistency is the technical criterion; no sample-specific diagonal position or saturation cutoff is supplied here.
  4:
    definition: |
      Singlets2: single-cell events retained by the second singlet-selection step.
    rule:
      x_marker: SSC-W
      y_marker: SSC-A
      regions: unsupported
    details: |
      This is a second singlet-cleanup pass after height/area-based selection. SSC-W measures pulse width and supplies additional evidence for residual doublets or aggregates; passing the first singlet step does not make the second redundant. SSC-A remains pulse-area context, not a molecular cell-type label.
  5:
    definition: |
      Live: events retained as the viable-cell fraction.
    rule:
      x_marker: Comp-PE-A
      y_marker: Comp-APC-Cy7-A
      regions:
      - [Live, Live]
      - [Unassigned, Unassigned]
    details: |
      The parent has already passed acquisition, intact-cell, and two singlet-cleanup stages. Live is a permissive viability-cleanup label in this workflow: it excludes only extremely high L/D dead-cell events rather than requiring every retained event to be strictly dye-negative. CD86 does not define viability. No dataset-specific exclusion coordinate or retained proportion is implied.
  6:
    definition: |
      PMN: polymorphonuclear granulocytes. Non_PMN: mononuclear leukocytes.
    rule:
      x_marker: Comp-BV421-A
      y_marker: SSC-A
      regions:
      - [Non_PMN, Non_PMN]
      - [PMN, Unassigned]
    details: |
      The parent is the viable-cell fraction and still contains both granulocytes and mononuclear leukocytes. Non_PMN includes lymphocytes, monocytes, and DCs, so it is not synonymous with CD14-negative cells. SSC-A supplies granularity context while CD14 supplies monocyte-associated context; neither should be confused with viability already addressed upstream.
  7:
    definition: |
      Neutrophils: CD16-high granulocytes. Eosinophils: CD16-low granulocytes.
    rule:
      x_marker: Comp-PE-Cy7-A
      y_marker: FSC-A
      regions:
      - [Eosinophils, Neutrophils]
      - [Eosinophils, Neutrophils]
    details: |
      The parent is already the PMN/granulocyte fraction. CD16 distinguishes the named neutrophil and eosinophil targets in this panel; FSC-A is a scatter context axis, not a second lineage label. This step is not another granulocyte-versus-mononuclear decision.
  8:
    definition: |
      B_Cells: CD19-positive CD3-negative B lymphocytes. T_Cells: CD3-positive CD19-negative T lymphocytes. Non_BT: CD3-negative CD19-negative non-B, non-T cells.
    rule:
      x_marker: Comp-BV786-A
      y_marker: Comp-Alexa Fluor 700-A
      regions:
      - [Non_BT, B_Cells]
      - [T_Cells, Unassigned]
    details: |
      B/T identification is performed within mononuclear leukocytes after granulocyte separation. Non_BT is an explicit non-B, non-T compartment that also supplies downstream myeloid and basophil branches; it is not merely uncertainty between B_Cells and T_Cells. Negative labels do not require raw or transformed axis zero.
  9:
    definition: |
      B_cells_CD86p: the CD86-expressing B-cell fraction.
    rule:
      x_marker: Comp-PE-A
      y_marker: Comp-Alexa Fluor 700-A
      regions:
      - [Unassigned, B_cells_CD86p]
      - [Unassigned, Unassigned]
    details: |
      The parent is already B cells selected as CD19-expressing and CD3-negative in the lineage split. CD86 marks the named expression/activation-associated fraction. CD3 carries inherited lineage context rather than a new B-cell activation criterion; CD86 expression should not be used to reassign T-lineage identity.
  10:
    definition: |
      Classical_monocytes: CD14-high CD16-low/intermediate monocytes. Intermediate_monocytes: CD14-high CD16-high monocytes. Patrolling_monocytes: CD14-dim CD16-high monocytes. Non_monocytes: CD14-negative non-monocyte cells.
    rule:
      x_marker: Comp-PE-Cy7-A
      y_marker: Comp-BV421-A
      regions:
      - [Non_monocytes, Non_monocytes]
      - [Unassigned, Patrolling_monocytes]
      - [Classical_monocytes, Intermediate_monocytes]
    details: |
      The parent is the non-B, non-T compartment, so it is not a pure monocyte parent. Non_monocytes is an explicitly named residual rather than an extra monocyte maturation state. Classical, intermediate, and patrolling labels refer to the monocyte subsets distinguished by CD14/CD16 phenotype; patrolling means non-classical monocytes, not every event with reduced CD14.
  11:
    definition: |
      CM_CD86p: the CD86-expressing classical monocyte fraction; CM means classical monocyte.
    rule:
      x_marker: Comp-PE-A
      y_marker: SSC-A
      regions:
      - [Unassigned, CM_CD86p]
      - [Unassigned, CM_CD86p]
    details: |
      CM means classical monocyte, not central memory. The parent is already the classical-monocyte subset; this step labels its CD86-expressing fraction. SSC-A supplies scatter context and does not introduce another monocyte-subset identity.
  12:
    definition: |
      IM_CD86p: the CD86-expressing intermediate monocyte fraction.
    rule:
      x_marker: Comp-PE-A
      y_marker: SSC-A
      regions:
      - [Unassigned, IM_CD86p]
      - [Unassigned, IM_CD86p]
    details: |
      The parent is already intermediate monocytes. The task selects the CD86-expressing fraction without redoing the CD14/CD16 monocyte split. Intermediate-monocyte membership alone does not imply CD86 expression or justify assigning the entire parent.
  13:
    definition: |
      PM_CD86p: the CD86-expressing patrolling monocyte fraction.
    rule:
      x_marker: Comp-PE-A
      y_marker: FSC-A
      regions:
      - [Unassigned, PM_CD86p]
      - [Unassigned, PM_CD86p]
    details: |
      The parent is already patrolling/non-classical monocytes. CD86 expression defines the additional named fraction, rather than another maturation category. Do not infer that all parent events qualify merely from their non-classical-monocyte identity; FSC-A is scatter context.
  14:
    definition: |
      HLADRp: the HLA-DR-expressing antigen-presenting cell fraction.
    rule:
      x_marker: Comp-BV510-A
      y_marker: SSC-A
      regions:
      - [Unassigned, HLADRp]
      - [Unassigned, HLADRp]
    details: |
      The parent is the Non_monocytes residual, not purified DCs. HLA-DR expression enriches antigen-presenting/DC candidates, which require further downstream distinctions. SSC-A is a context axis rather than an independent HLA-DR-positivity criterion.
  15:
    definition: |
      HLADRp_CD16n: the CD16-negative DC-candidate fraction.
    rule:
      x_marker: Comp-PE-Cy7-A
      y_marker: Comp-BV421-A
      regions:
      - [HLADRp_CD16n, Unassigned]
      - [Unassigned, Unassigned]
    details: |
      The parent is the HLA-DR-expressing APC-candidate fraction from Non_monocytes. This step removes residual CD16-expressing contaminants before DC annotation. CD14 records inherited monocyte-exclusion context; a negative CD16 call alone does not prove final dendritic-cell identity.
  16:
    definition: |
      pDC: CD303-positive CD123-high plasmacytoid dendritic cells. Non_pDC: CD303-negative CD123-low non-plasmacytoid DC candidates.
    rule:
      x_marker: Comp-FITC-A
      y_marker: Comp-PerCP-Cy5-5-A
      regions:
      - [Non_pDC, Unassigned]
      - [Unassigned, pDC]
    details: |
      The parent has undergone non-B/non-T, non-monocyte, HLA-DR, and residual-CD16 cleanup. The pDC target uses the joint CD303/CD123 phenotype. Non_pDC remains a DC-candidate fraction for the subsequent myeloid branch, not a claim that every residual event is already an mDC.
  17:
    definition: |
      pDC_CD86p: the CD86-expressing plasmacytoid dendritic cell fraction.
    rule:
      x_marker: Comp-PE-A
      y_marker: FSC-A
      regions:
      - [Unassigned, pDC_CD86p]
      - [Unassigned, pDC_CD86p]
    details: |
      The parent is already the plasmacytoid DC fraction. CD86 identifies an additional expression/activation-associated fraction within pDCs; it is not the marker that originally establishes pDC identity. FSC-A is a scatter context axis.
  18:
    definition: |
      mDC: CD11c-positive myeloid or conventional dendritic cells.
    rule:
      x_marker: Comp-BV650-A
      y_marker: FSC-A
      regions:
      - [Unassigned, mDC]
      - [Unassigned, mDC]
    details: |
      The parent is the Non_pDC candidate fraction after earlier lineage and APC cleanup. CD11c supports the myeloid/conventional DC target in this workflow; non-pDC membership alone does not establish that every event is mDC. FSC-A supplies scatter context.
  19:
    definition: |
      mDC1: the CD1c-positive myeloid dendritic cell subset as named in this dataset. mDC2: the CD1c-negative myeloid dendritic cell subset as named in this dataset. These dataset-specific labels must not be interpreted as canonical cDC1/cDC2 identities.
    rule:
      x_marker: Comp-APC-A
      y_marker: FSC-A
      regions:
      - [mDC2, mDC1]
      - [mDC2, mDC1]
    details: |
      This is subtyping within the myeloid-DC parent. The panel's mDC1 label means CD1c-positive and mDC2 means CD1c-negative; their numeric suffixes must not be substituted with canonical cDC1/cDC2 identities. FSC-A supplies scatter context rather than changing this dataset-specific label convention.
  20:
    definition: |
      mDC_CD86p: the CD86-expressing myeloid dendritic cell fraction.
    rule:
      x_marker: Comp-PE-A
      y_marker: FSC-A
      regions:
      - [Unassigned, mDC_CD86p]
      - [Unassigned, mDC_CD86p]
    details: |
      The parent is the combined myeloid-DC fraction before the mDC1/mDC2 split. This CD86-expressing target aggregates both named subtypes; it must not be restricted to either one. FSC-A supplies scatter context.
  21:
    definition: |
      mDC1_CD86p: the CD86-expressing fraction of this dataset's mDC1 subset, which denotes CD1c-positive myeloid dendritic cells.
    rule:
      x_marker: Comp-PE-A
      y_marker: SSC-A
      regions:
      - [Unassigned, mDC1_CD86p]
      - [Unassigned, mDC1_CD86p]
    details: |
      The parent is this panel's mDC1 subset, meaning CD1c-positive myeloid DCs. CD86 is an additional expression/activation-associated annotation within that subset. Retain the panel's label convention rather than interpreting mDC1 as canonical cDC1; SSC-A is scatter context.
  22:
    definition: |
      mDC2_CD86p: the CD86-expressing fraction of this dataset's mDC2 subset, which denotes CD1c-negative myeloid dendritic cells.
    rule:
      x_marker: Comp-PE-A
      y_marker: SSC-A
      regions:
      - [Unassigned, mDC2_CD86p]
      - [Unassigned, mDC2_CD86p]
    details: |
      The parent is this panel's mDC2 subset, meaning CD1c-negative myeloid DCs. CD86 is an additional expression/activation-associated annotation within that subset. Retain the panel's label convention rather than interpreting mDC2 as canonical cDC2; SSC-A is scatter context.
  23:
    definition: |
      HLADRn_CD14n: the HLA-DR/CD14 double-negative residual cell fraction.
    rule:
      x_marker: Comp-BV421-A
      y_marker: Comp-BV510-A
      regions:
      - [HLADRn_CD14n, Unassigned]
      - [Unassigned, Unassigned]
    details: |
      This branch starts from Non_BT in parallel with the monocyte/DC branch. The HLA-DR/CD14-negative target is a candidate residual that can include basophils and NK cells; it is not a final basophil label. Negative annotation does not require either prepared channel value to be zero.
  24:
    definition: |
      Basophils: CD123-high CD16-negative basophils.
    rule:
      x_marker: Comp-PE-Cy7-A
      y_marker: Comp-PerCP-Cy5-5-A
      regions:
      - [Unassigned, Unassigned]
      - [Basophils, Unassigned]
    details: |
      The parent is the HLA-DR/CD14-negative candidate compartment. Basophils require positive identification through CD123 with the CD16-negative phenotype; the parent alone is not sufficient to call every event a basophil. Keep the distinction between upstream exclusion and current positive identification.
Acute2020:
  1:
    definition: |
      Cleanup1: the cell-event fraction retained after calibration-bead exclusion. Bead: calibration beads.
    rule:
      x_marker: Time
      y_marker: 140Ce_Bead
      regions:
      - [Cleanup1, Cleanup1]
      - [Bead, Bead]
    details: |
      This is calibration-bead versus cell-event separation, not a leukocyte-subtype decision. Ce bead signal supplies the relevant identity while Time records acquisition order. Cleanup1 means bead-excluded events, not proof that every retained event is live, intact, or a singlet.
  2:
    definition: |
      Cleanup2: the cell-event fraction retained by fitting-residual quality control.
    rule:
      x_marker: Time
      y_marker: Residual
      regions: unsupported
    details: |
      The parent has had calibration beads removed but is not yet guaranteed to contain only clean singlets. Residual is an ion-cloud fitting-quality variable used to exclude doublets, partial events, and acquisition artifacts; Time is acquisition context. A QC value must not be interpreted as a molecular positive/negative cell phenotype.
  3:
    definition: |
      Cleanup3: the cell-event fraction retained by ion-cloud-centering quality control.
    rule:
      x_marker: Time
      y_marker: Center
      regions: unsupported
    details: |
      The input has passed bead exclusion and fitting-residual cleanup. Center assesses ion-cloud centering and helps reject events without a well-formed acquisition profile. This is technical event-quality selection rather than a biological lineage label; Time does not define a cell type.
  4:
    definition: |
      Cleanup4: the cell-event fraction retained by baseline-offset quality control.
    rule:
      x_marker: Time
      y_marker: Offset
      regions: unsupported
    details: |
      Earlier cleanup does not by itself establish a normal event baseline. Offset addresses baseline-offset quality and acquisition artifacts, independently of the later cell-lineage decisions. Interpret it as a technical QC variable rather than a protein-expression marker.
  5:
    definition: |
      Cleanup5: the singlet-event fraction retained by ion-cloud-width quality control.
    rule:
      x_marker: Time
      y_marker: Width
      regions: unsupported
    details: |
      The parent has passed earlier acquisition-quality cleanup. Width supplies an additional technical check for wide-pulse doublets and aggregates; earlier QC acceptance is not proof of a single-cell event. No observed pulse-width range or sample-specific acceptance boundary is prescribed here.
  6:
    definition: |
      Cleanup6: the cell-event fraction retained by viability cleanup.
    rule:
      x_marker: Time
      y_marker: 103Rh_Live_Dead
      regions:
      - [Cleanup6, Cleanup6]
      - [Unassigned, Unassigned]
    details: |
      This is viability cleanup after earlier technical-event filtering. The Rh live/dead channel addresses dead-cell exclusion; passing bead and ion-cloud QC does not itself establish viability. Time is acquisition context, not a second viability marker.
  7:
    definition: |
      Ir: nucleated events.
    rule:
      x_marker: 191Ir_DNA1
      y_marker: Event_length
      regions:
      - [Unassigned, Ir]
      - [Unassigned, Ir]
    details: |
      The parent has passed technical and viability cleanup. Ir selects nucleated cell events through DNA1; it is not another live/dead decision. Event_length is displayed but is not a separate biological subtype definition at this step.
  8:
    definition: |
      CD45: all leukocytes, including granulocytes.
    rule:
      x_marker: 193Ir_DNA2
      y_marker: 89Y_CD45
      regions:
      - [Unassigned, Unassigned]
      - [Unassigned, CD45]
    details: |
      The parent is already DNA1-positive nucleated events, but that does not guarantee acceptable single-cell nuclear content. This leukocyte step also excludes doublets, damaged or hyperploid nuclear events, and non-cell/debris events using DNA2 context, while CD45 supplies leukocyte identity. Do not reduce the target to CD45 positivity alone; no sample-specific DNA2 acceptance range is supplied. On the CD45 axis, only CD45-negative events are excluded.
  9:
    definition: |
      Mononuclear: CD66b-negative CD45-high mononuclear leukocytes. Granulocyte: CD66b-positive CD45-intermediate granulocytes. CD66bnegCD45lo: the CD66b-negative CD45-low residual event fraction. CD45hiCD66bpos: the CD45-high CD66b-positive leukocyte fraction.
    rule:
      x_marker: 172Yb_CD66b
      y_marker: 89Y_CD45
      regions:
      - [CD66bnegCD45lo, Granulocyte]
      - [Mononuclear, CD45hiCD66bpos]
    details: |
      The parent is the retained leukocyte fraction. Mononuclear and Granulocyte name the main lineage compartments; the marker-coded residual and CD45-high/CD66b-positive fraction are additional explicit targets rather than cells to force into those two lineages. Preserve these panel annotation categories without inferring their proportions.
  10:
    definition: |
      CD14negCD56neg: the CD14/CD56 double-negative mononuclear fraction.
    rule:
      x_marker: 168Er_CD14
      y_marker: 163Dy_CD56_NCAM
      regions:
      - [CD14negCD56neg, Unassigned]
      - [Unassigned, Unassigned]
    details: |
      The parent is mononuclear leukocytes. This is a cleanup selection excluding the CD14-associated monocyte and CD56-associated NK fractions before B-lineage processing, not a final B-cell call. The retained CD14/CD56-negative fraction can still contain multiple cell identities.
  11:
    definition: |
      CD123negCD3neg: the CD123/CD3 double-negative residual fraction.
    rule:
      x_marker: 143Nd_CD123_IL-3R
      y_marker: 170Er_CD3
      regions:
      - [CD123negCD3neg, Unassigned]
      - [Unassigned, Unassigned]
    details: |
      The parent has already undergone CD14/CD56 cleanup. This step removes CD3-expressing T cells and CD123-expressing residuals before B-lineage annotation. The retained fraction is still a candidate pool rather than a final B-cell or plasmablast identity.
  12:
    definition: |
      CD20neg: all CD20-negative events in the parent. TotalCD19B: CD19⁺CD20⁺ mature B cells.
    rule:
      x_marker: 144Nd_CD19
      y_marker: 171Yb_CD20
      regions:
      - [CD20neg, CD20neg]
      - [Unassigned, TotalCD19B]
    details: |
      The parent is a cleaned B-lineage candidate pool, not an already purified mature-B population. TotalCD19B is the mature-B target; CD20neg is a separate residual that feeds plasmablast identification. CD20-negative membership alone does not establish a plasmablast.
  13:
    definition: |
      NaiveB: IgD-positive CD27-negative naive B cells. IgDnegMemB: IgD-negative CD27-positive memory B cells. IgDposMemB: IgD-positive CD27-positive non-switched memory B cells.
    rule:
      x_marker: 174Yb_IgD
      y_marker: 154Sm_CD27
      regions:
      - [Unassigned, NaiveB]
      - [IgDnegMemB, IgDposMemB]
    details: |
      The parent is the mature-B fraction. NaiveB, IgD-positive memory, and IgD-negative memory are the named targets; the IgD/CD27 double-negative phenotype is not an additional named category here. Do not assign every remaining parent event to one of the three merely by elimination.
  14:
    definition: |
      Plasmablast: CD27-high CD38-high antibody-secreting B-lineage cells.
    rule:
      x_marker: 154Sm_CD27
      y_marker: 161Dy_CD38
      regions:
      - [Unassigned, Unassigned]
      - [Unassigned, Plasmablast]
    details: |
      Plasmablast identification is performed within the CD20-negative residual. CD20 loss is not sufficient for antibody-secreting-cell identity; joint CD27/CD38 phenotype is relevant. The entire residual must not automatically be called Plasmablast.
  15:
    definition: |
      NonTNonB: CD19-negative CD3-negative non-T, non-B cells.
    rule:
      x_marker: 144Nd_CD19
      y_marker: 170Er_CD3
      regions:
      - [NonTNonB, Unassigned]
      - [Unassigned, Unassigned]
    details: |
      The parent is mononuclear leukocytes. NonTNonB is a shared residual for several innate and myeloid branches, not one final cell type. B/T exclusion does not establish monocyte, NK, DC, basophil, or ILC identity by itself.
  16:
    definition: |
      NonBNonNK: CD56-negative CD20-negative non-B, non-NK cells.
    rule:
      x_marker: 163Dy_CD56_NCAM
      y_marker: 171Yb_CD20
      regions:
      - [NonBNonNK, Unassigned]
      - [Unassigned, Unassigned]
    details: |
      The parent already excludes the main T/B fractions. This further cleanup removes NK-associated and residual B-associated events before monocyte and basophil/ILC processing. The retained NonBNonNK fraction remains heterogeneous and must not be equated with monocytes alone.
  17:
    definition: |
      TotalMonocyte: CD11c-positive monocytes, CD14-high to CD14-low, combining the monocyte subsets.
    rule:
      x_marker: 147Sm_CD11c
      y_marker: 168Er_CD14
      regions:
      - [Unassigned, TotalMonocyte]
      - [Unassigned, TotalMonocyte]
    details: |
      The parent has undergone T/B and NK/residual-B cleanup. TotalMonocyte combines classical, intermediate, and non-classical monocytes rather than selecting a CD14-high subset only. CD14 can distinguish later monocyte subsets; do not use the parent-cleanup label alone as proof of monocyte identity.
  18:
    definition: |
      ClassicalMono: CD14-high CD38-high classical monocytes. TransitionalMono: CD14-intermediate CD38-intermediate monocytes. NonclassicalMono: CD14-low CD38-low non-classical monocytes.
    rule:
      x_marker: 161Dy_CD38
      y_marker: 168Er_CD14
      regions:
      - [NonclassicalMono, Unassigned, Unassigned]
      - [Unassigned, TransitionalMono, Unassigned]
      - [Unassigned, Unassigned, ClassicalMono]
    details: |
      The parent is the combined monocyte fraction. ClassicalMono, TransitionalMono, and NonclassicalMono are this panel's three monocyte annotations, with TransitionalMono denoting intermediate monocytes. CD38/CD14 is the displayed panel-specific phenotyping combination, not an instruction to infer maturation identity from acquisition quality or from the preceding cleanup labels.
  19:
    definition: |
      Basophil: HLA-DR-negative CD123-high basophils. HLADRloCD123lo: the HLA-DR-low CD123-low residual fraction.
    rule:
      x_marker: 173Yb_HLA-DR
      y_marker: 143Nd_CD123_IL-3R
      regions:
      - [HLADRloCD123lo, Unassigned]
      - [Basophil, Unassigned]
    details: |
      The parent is the non-T/non-B, non-NK residual. Basophil and the HLA-DR-low/CD123-low residual are distinct named outputs. The latter can supply ILC candidates downstream and must not be treated as a basophil merely because other lineages were removed upstream.
  20:
    definition: |
      ILC: CD161⁺CD127⁺ innate lymphoid cell candidates.
    rule:
      x_marker: 151Eu_CD161
      y_marker: 176Yb_CD127_IL-7Ra
      regions:
      - [Unassigned, Unassigned]
      - [Unassigned, ILC]
    details: |
      ILC identification is applied to the HLA-DR-low/CD123-low residual after lineage cleanup. CD161/CD127 supplies candidate-identification context; being in a lineage-excluded residual is not sufficient by itself to call every event an innate lymphoid cell.
  21:
    definition: |
      NonTNonBCD14neg: CD14-negative CD3-negative non-T, non-B, non-monocyte cells.
    rule:
      x_marker: 168Er_CD14
      y_marker: 170Er_CD3
      regions:
      - [NonTNonBCD14neg, Unassigned]
      - [Unassigned, Unassigned]
    details: |
      The parent already excludes T and B cells. This further CD14-negative selection removes monocyte-associated events before the NK/DC branch. CD3 carries inherited T-lineage exclusion context; the retained fraction is not a final NK or DC identity.
  22:
    definition: |
      TotalDC: CD56-negative HLA-DR-high dendritic cells, combining dendritic cell subsets. TotalNK: CD56-positive HLA-DR-low natural killer cells, combining NK-cell subsets.
    rule:
      x_marker: 163Dy_CD56_NCAM
      y_marker: 173Yb_HLA-DR
      regions:
      - [Unassigned, TotalNK]
      - [TotalDC, Unassigned]
    details: |
      The parent has undergone T/B and CD14-associated monocyte exclusion. TotalDC and TotalNK are combined lineage targets, not their later subtypes. Residual events that match neither DC nor NK phenotype remain outside the two named targets.
  23:
    definition: |
      EarlyNK: CD57-negative NK cells. LateNK: CD57-positive NK cells.
    rule:
      x_marker: 155Gd_CD57
      y_marker: 163Dy_CD56_NCAM
      regions:
      - [Unassigned, Unassigned]
      - [EarlyNK, LateNK]
    details: |
      The parent is already NK cells. CD57 distinguishes the early- and late-maturation labels in this panel, while CD56 carries NK-lineage context. This is not a new NK-versus-non-NK decision, and maturation status must not be inferred from a presumed population frequency.
  24:
    definition: |
      pDC: CD11c-negative CD123-high plasmacytoid dendritic cells. cDC: CD11c-positive CD123-low conventional dendritic cells.
    rule:
      x_marker: 147Sm_CD11c
      y_marker: 143Nd_CD123_IL-3R
      regions:
      - [Unassigned, cDC]
      - [pDC, Unassigned]
    details: |
      The parent is the combined DC fraction. Conventional and plasmacytoid DCs are separate named outputs, so total-DC membership is not a reason to force the same CD11c/CD123 phenotype on both. Further myeloid-DC refinement occurs only on the conventional branch.
  25:
    definition: |
      mDC: CD38-positive myeloid DCs.
    rule:
      x_marker: 161Dy_CD38
      y_marker: 143Nd_CD123_IL-3R
      regions:
      - [Unassigned, mDC]
      - [Unassigned, Unassigned]
    details: |
      The cDC parent still contains CD38-low non-DC myeloid cells (e.g. CD16⁺ monocytes).
  26:
    definition: |
      CD11cnegCD14neg: the CD11c/CD14 double-negative non-myeloid fraction.
    rule:
      x_marker: 168Er_CD14
      y_marker: 147Sm_CD11c
      regions:
      - [CD11cnegCD14neg, Unassigned]
      - [Unassigned, Unassigned]
    details: |
      The parent is mononuclear leukocytes. CD11c/CD14-negative selection supplies the non-myeloid candidate fraction for the T-cell branch; it is not itself the final T-cell label. Keep upstream exclusion separate from downstream positive T-lineage identification.
  27:
    definition: |
      CD3T: CD3-positive CD19-negative T lymphocytes.
    rule:
      x_marker: 144Nd_CD19
      y_marker: 170Er_CD3
      regions:
      - [Unassigned, Unassigned]
      - [CD3T, Unassigned]
    details: |
      The parent has undergone CD11c/CD14 myeloid exclusion. CD3 supplies T-lineage identification before receptor-subtype annotation, while CD19 helps distinguish residual B-lineage events. The parent alone is not sufficient to assign every event to CD3T.
  28:
    definition: |
      abT: TCRgd-negative CD3-positive alpha-beta T cells. gdT: TCRgd-positive CD3-positive gamma-delta T cells.
    rule:
      x_marker: 164Dy_TCRgd
      y_marker: 170Er_CD3
      regions:
      - [Unassigned, Unassigned]
      - [abT, gdT]
    details: |
      The parent is already T cells. The TCRgd-expressing branch denotes gamma-delta T cells and the other named branch denotes alpha-beta T cells; CD3 supplies inherited T-lineage context. Do not treat receptor-subtype separation as a second T-versus-non-T classification.
  29:
    definition: |
      CD8: CD4-negative CD8a-positive cytotoxic T cells. CD4: CD4-positive CD8a-negative helper T cells. DPT: CD4-positive CD8a-positive double-positive T cells. DNT: CD4-negative CD8a-negative double-negative T cells.
    rule:
      x_marker: 145Nd_CD4
      y_marker: 146Nd_CD8a
      regions:
      - [DNT, CD4]
      - [CD8, DPT]
    details: |
      The parent is the alpha-beta T-cell fraction. DPT and DNT refer to CD4/CD8 co-expression categories within that T-cell lineage; DNT does not mean non-T cells. All four CD4/CD8 categories are named outputs here.
  30:
    definition: |
      CD8Naive: CD45RA-positive CD27-positive naive cytotoxic T cells. CD8TEMRA: CD45RA-positive CD27-negative CD45RA-reexpressing effector memory cytotoxic T cells. CD8/CD45RAnegCD27pos: CD45RA-negative CD27-positive memory CD8 T cells. CD8/CD45RAnegCD27neg: CD45RA-negative CD27-negative memory CD8 T cells.
    rule:
      x_marker: 150Nd_CD45RA
      y_marker: 154Sm_CD27
      regions:
      - [CD8/CD45RAnegCD27neg, CD8TEMRA]
      - [CD8/CD45RAnegCD27pos, CD8Naive]
    details: |
      The parent is cytotoxic alpha-beta T cells. CD45RA/CD27 provides the first differentiation split; the two CD45RA-negative fractions remain broader buckets that are subdivided by CCR7 downstream. CD8TEMRA denotes the CD45RA-reexpressing effector-memory category and must not be equated with naive cells solely because both retain CD45RA.
  31:
    definition: |
      CD8Naive/activated: the activation-associated HLA-DR single-positive fraction of naive cytotoxic T cells. CD8Naive/CD38pos: the CD38 single-positive fraction of naive cytotoxic T cells. CD8Naive/activated+CD38pos: the HLA-DR/CD38 double-positive fraction of naive cytotoxic T cells.
    rule:
      x_marker: 173Yb_HLA-DR
      y_marker: 161Dy_CD38
      regions:
      - [Unassigned, CD8Naive/activated]
      - [CD8Naive/CD38pos, CD8Naive/activated+CD38pos]
    details: |
      The parent is naive CD8 T cells. HLA-DR/CD38 expression adds activation-associated annotation independently of naive differentiation; do not redo the upstream subtype assignment. The named outputs are HLA-DR single-positive, CD38 single-positive, and double-positive fractions. The double-negative resting fraction is not another named target at this step and remains Unassigned.
  32:
    definition: |
      CD8TCM: CCR7-positive CD8a-positive central memory cytotoxic T cells. CD8TEM1: CCR7-negative CD8a-positive early-stage effector memory cytotoxic T cells designated TEM1 in this panel (CD45RA-negative, CD27-positive, CCR7-negative).
    rule:
      x_marker: 167Er_CD197_CCR7
      y_marker: 146Nd_CD8a
      regions:
      - [Unassigned, Unassigned]
      - [CD8TEM1, CD8TCM]
    details: |
      The parent is the CD45RA-negative, CD27-retaining CD8 memory fraction. CCR7 distinguishes this panel's TCM and TEM1 categories; CD8 supplies inherited lineage context. TEM1 is the early-stage effector-memory label in this scheme, not the CD27-negative TEM2/TEM3 branch.
  33:
    definition: |
      CD8TEM1/activated: the activation-associated HLA-DR single-positive fraction of this panel's early-stage TEM1 effector memory cytotoxic T cells (CD45RA-negative, CD27-positive, CCR7-negative). CD8TEM1/CD38pos: the CD38 single-positive fraction of this panel's early-stage TEM1 effector memory cytotoxic T cells (CD45RA-negative, CD27-positive, CCR7-negative). CD8TEM1/activated+CD38pos: the HLA-DR/CD38 double-positive fraction of this panel's early-stage TEM1 effector memory cytotoxic T cells (CD45RA-negative, CD27-positive, CCR7-negative).
    rule:
      x_marker: 173Yb_HLA-DR
      y_marker: 161Dy_CD38
      regions:
      - [Unassigned, CD8TEM1/activated]
      - [CD8TEM1/CD38pos, CD8TEM1/activated+CD38pos]
    details: |
      The parent is this panel's CD8 TEM1 subset. HLA-DR/CD38 expression adds activation-associated annotation independently of TEM1 differentiation; do not redo the upstream subtype assignment. The named outputs are HLA-DR single-positive, CD38 single-positive, and double-positive fractions. The double-negative resting fraction is not another named target at this step and remains Unassigned.
  34:
    definition: |
      CD8TCM/activated: the activation-associated HLA-DR single-positive fraction of central memory cytotoxic T cells. CD8TCM/CD38pos: the CD38 single-positive fraction of central memory cytotoxic T cells. CD8TCM/activated+CD38pos: the HLA-DR/CD38 double-positive fraction of central memory cytotoxic T cells.
    rule:
      x_marker: 173Yb_HLA-DR
      y_marker: 161Dy_CD38
      regions:
      - [Unassigned, CD8TCM/activated]
