      The parent is the non-T/non-B, non-NK residual. Basophil and the HLA-DR-low/CD123-low residual are distinct named outputs. The latter can supply ILC candidates downstream and must not be treated as a basophil merely because other lineages were removed upstream.
  20:
    definition: |
