      The parent is a cleaned B-lineage candidate pool, not an already purified mature-B population. TotalCD19B is the mature-B target; CD20neg is a separate residual that feeds plasmablast identification. CD20-negative membership alone does not establish a plasmablast.
  13:
    definition: |
      NaiveB: IgD-positive CD27-negative naive B cells. IgDnegMemB: IgD-negative CD27-positive memory B cells. IgDposMemB: IgD-positive CD27-positive non-switched memory B cells.
