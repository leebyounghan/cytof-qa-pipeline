  # ----- S8. Daclizumab (anti-CD25) — peripheral Treg depletion -----
  - hard_id: treg_depletion_daclizumab_fr_fcm_z74d_hc_step03
    scenario: treg_depletion_daclizumab
    dataset: FR-FCM-Z74D_hc
