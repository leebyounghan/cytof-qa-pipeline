    deplete: ["Granulocyte"]

  # ----- S5. pDC depletion — Chronic viral infection -----
  - hard_id: pdc_depletion_acute2020_step24
    scenario: pdc_depletion
    dataset: Acute2020
    step: 24
    step_column: "Step24_147Sm_CD11c|143Nd_CD123_IL-3R"
    deplete: ["pDC"]

  - hard_id: pdc_depletion_acute2021_step24
    scenario: pdc_depletion
    dataset: Acute2021
    step: 24
    step_column: "Step24_147Sm_CD11c|143Nd_CD123_IL-3R"
    deplete: ["pDC"]

  - hard_id: pdc_depletion_vaccine_step24
    scenario: pdc_depletion
    dataset: Vaccine
    step: 24
    step_column: "Step24_147Sm_CD11c|143Nd_CD123_IL-3R"
    deplete: ["pDC"]

  - hard_id: pdc_depletion_frdr_covid19_step16
    scenario: pdc_depletion
    dataset: FRDR_covid19
    step: 16
    step_column: "Step16_CD303|CD123"
    deplete: ["pDC"]

  - hard_id: pdc_depletion_lyoplate_dc_step05
    scenario: pdc_depletion
    dataset: Lyoplate_DC
    step: 5
    step_column: "Step05_CD11c|CD123"
    deplete: ["pDC"]

  # ----- S6. Severe COVID-19 — Nonclassical monocyte collapse -----
  - hard_id: nonclassical_mono_loss_frdr_covid19_step10
    scenario: nonclassical_mono_loss
    dataset: FRDR_covid19
    step: 10
    step_column: "Step10_CD16|CD14"
    deplete: ["Patrolling_monocytes"]

  # ----- S7. Th17 axis collapse — synthetic robustness test -----
  # NOT a literal anti-IL-17 / anti-IL-12/23 drug model. Tests whether the model
  # hallucinates a Th17 cluster whose density signature has been removed.
  - hard_id: th17_axis_collapse_acute2020_step54
    scenario: th17_axis_collapse
    dataset: Acute2020
    step: 54
    step_column: "Step54_141Pr_CD196_CCR6|156Gd_CD183_CXCR3"
    deplete: ["Th17"]

  - hard_id: th17_axis_collapse_acute2021_step54
    scenario: th17_axis_collapse
    dataset: Acute2021
