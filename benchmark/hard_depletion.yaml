    step: 4
    step_column: "Step04_CCR7|CD45RA"
    deplete: ["Naive_CD4"]

  - hard_id: immunosenescence_lyoplate_tcell_step03
    scenario: immunosenescence
    dataset: Lyoplate_tcell
    step: 3
    step_column: "Step03_CCR7|CD45RA"
    deplete: ["CD4_Naive"]

  - hard_id: immunosenescence_lyoplate_tcell_step05
    scenario: immunosenescence
    dataset: Lyoplate_tcell
    step: 5
    step_column: "Step05_CCR7|CD45RA"
    deplete: ["CD8_Naive"]

  - hard_id: immunosenescence_fr_fcm_z74d_tissue_step02
    scenario: immunosenescence
    dataset: FR-FCM-Z74D_tissue
    step: 2
    step_column: "Step02_CCR7|CD45RA"
    deplete: ["Naive_CD8"]

  - hard_id: immunosenescence_fr_fcm_z74d_tissue_step04
    scenario: immunosenescence
    dataset: FR-FCM-Z74D_tissue
    step: 4
    step_column: "Step04_CCR7|CD45RA"
    deplete: ["Naive_CD4"]

  # ----- S4. Neutropenia — Granulocyte / PMN depletion -----
  - hard_id: neutropenia_acute2020_step09
    scenario: neutropenia
    dataset: Acute2020
    step: 9
    step_column: "Step09_172Yb_CD66b|89Y_CD45"
    deplete: ["Granulocyte"]

  - hard_id: neutropenia_acute2021_step09
    scenario: neutropenia
