name: Lyoplate_bcell
panel: ''
instrument: BD LSR II
n_steps: 5
n_samples: 63
cofactor: 150.0
channel_marker_map:
  FSC-A: FSC-A
  SSC-A: SSC-A
  Live: Viability
  CD3: CD3
  CD19: CD19
  CD20: CD20
  IgD: IgD
  CD27: CD27
  CD38: CD38
  CD24: CD24
gating_plan:
- step: 1
  parent: ALL
  x_marker: CD3
  y_marker: CD19
  annotation column name: Step01_CD3|CD19
  annotation categories:
  - CD19pos
  - CD3pos
  note: 'CD19pos: B-lineage cells (entry point for all downstream B-cell subsetting). CD3pos: T-lineage cells (terminates here in this panel — no further T-cell resolution; this cohort has separate T-cell / Treg panels).'
  tips: 'Lymphocyte lineage split on pre-gated Live singlet lymphocytes. CD19pos: CD19+ CD3-. CD3pos: CD3+ CD19-. CD3- CD19- events (NK cells, residual non-B/T lineages) are not annotated at this step because the remainder is not a defined cell type for this panel''s purpose.'
- step: 2
  parent: Step01_CD3|CD19 == CD19pos
  x_marker: CD3
  y_marker: CD20
  annotation column name: Step02_CD3|CD20
  annotation categories:
  - CD19_CD20pos
  - CD19_CD20neg
  note: 'CD19_CD20pos: mature B cells (the dominant B-cell pool in blood; includes naive/memory/transitional resolved downstream). CD19_CD20neg: pre-plasmablast / plasmablast-candidate B-lineage cells (mature plasmablasts down-regulate CD20 as they differentiate; resolved downstream).'
  tips: 'Split mature B-cell pool from CD20-negative B-lineage (pre-plasmablast) within CD19+ cells. CD19_CD20pos: CD20+. CD19_CD20neg: CD20-. Axis design caveat: x_marker is CD3, but parent is CD19+ CD3- — CD3 on x is a purity sanity-check axis (events should cluster at CD3-low); the actual split is driven by CD20 on y.'
- step: 3
  parent: Step02_CD3|CD20 == CD19_CD20pos
  x_marker: IgD
  y_marker: CD27
  annotation column name: Step03_IgD|CD27
  annotation categories:
  - Naive
  - Memory_IgDpos
  - Memory_IgDneg
  - IgDneg_CD27neg
  note: 'Naive: un-activated naive B cells (no somatic hypermutation, no class switch). Memory_IgDpos: non-switched memory / IgM memory B cells (may include marginal-zone-like B cells). Memory_IgDneg: class-switched memory B cells (the major memory population carrying IgG/IgA/IgE). IgDneg_CD27neg: double-negative (DN) B cells — a heterogeneous compartment that may include age-associated B cells, activated-naive-like, or exhausted B cells, reported to expand in autoimmunity and chronic infection.'
  tips: 'Mature B-cell maturation / class-switch state (IgD × CD27 quadrants, widely used Klein/Sanz scheme). Naive: IgD+ CD27- (surface IgM+ IgD+). Memory_IgDpos: IgD+ CD27+ (the IgM-memory vs MZ-like boundary is not strictly resolved by IgD/CD27 alone). Memory_IgDneg: IgD- CD27+. IgDneg_CD27neg: IgD- CD27-. ABCs are classically T-bet+ CD11c+ — neither marker is in this panel; further sub-classification within DN is not possible from this panel alone. Useful co-markers: CD38 further separates transitional B cells (CD38hi CD24hi, resolved in parallel at Step 4), which sit inside the Naive quadrant here.'
- step: 4
  parent: Step02_CD3|CD20 == CD19_CD20pos
  x_marker: CD38
  y_marker: CD24
  annotation column name: Step04_CD38|CD24
  annotation categories:
  - Transitional
  note: 'Transitional: transitional B cells (recent bone-marrow emigrants; immature B cells).'
  tips: 'Transitional B-cell identification (independent of the IgD/CD27 axis used at Step 3 — parallel annotation on the same parent). Transitional: CD38hi CD24hi. Overlap caveat: transitional B cells are IgD+ CD27-, so they also fall into the `Naive` bin at Step 3 — Step 3 and Step 4 produce overlapping labels on the same cells by design, not as an artifact (downstream analyses that need a Naive-without-Transitional pool should compute `Naive AND NOT Transitional` via boolean operation). Useful co-markers: IgM is typically high on transitional B but is not in this panel.'
- step: 5
  parent: Step02_CD3|CD20 == CD19_CD20neg
  x_marker: CD38
  y_marker: CD27
  annotation column name: Step05_CD38|CD27
  annotation categories:
  - Plasmablasts
  note: 'Plasmablasts: antibody-secreting B-lineage cells (rare population, typically <5% of B cells at baseline but expands rapidly during acute immune responses).'
  tips: 'Plasmablast identification within the CD19+ CD20- pool. Plasmablasts: CD38++ CD27+. Parent design is important: plasmablasts are CD20-low/negative, so they would be missed if gated from the CD20+ (mature B) branch — hence the separate parent at Step 2. The CD19+ CD20- parent also contains CD19+CD20- non-plasmablast residuals, which are excluded by requiring CD27+ CD38++ here.'
