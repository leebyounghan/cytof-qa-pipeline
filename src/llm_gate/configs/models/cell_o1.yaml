# Cell-o1 — LLM-Gate variant. Mirrors src/llm/configs/models/cell_o1.yaml.
# Qwen2.5-7B backbone (not Qwen3) → no reasoning_parser, no
# thinking_token_budget. strip_think still applies (plain-regex on
# <think>...</think> in the literal output).
model:
  hf_id: ncbi/Cell-o1
  served_name: Cell-o1
server:
  data_parallel_size: 8
  tensor_parallel_size: 1
  max_model_len: 32768
  gpu_memory_utilization: 0.95
  enable_prefix_caching: true
  trust_remote_code: true
  enable_expert_parallel: false
generation:
  max_tokens: 8192
  strip_think: true
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  presence_penalty: 1.5
