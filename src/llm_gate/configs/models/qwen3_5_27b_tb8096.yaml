# Qwen3.5-27B with thinking_token_budget=8096 — LLM-Gate variant.
# served_name suffixed with -tb8096 to keep outputs separate from
# any existing no-budget results. Mirrors qwen3_6_27b_tb8096.yaml's
# server layout (DP=4, TP=2); model path from the c2s-side config.
model:
  hf_id: Qwen/Qwen3.5-27B
  served_name: Qwen3.5-27B-tb8096
server:
  data_parallel_size: 2
  tensor_parallel_size: 2
  max_model_len: 65536
  gpu_memory_utilization: 0.9
  enable_prefix_caching: true
  trust_remote_code: true
  reasoning_parser: qwen3
  enable_expert_parallel: false
generation:
  max_tokens: 32768
  strip_think: true
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  presence_penalty: 0.0
  thinking_token_budget: 8096
