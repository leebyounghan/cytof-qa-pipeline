# GPT-6 Luna (OpenAI API) — LLM-C2S config.
# Use with the OpenAI runners (NOT run_vllm_*.sh). Requires OPENAI_API_KEY.
model:
  openai_id: gpt-6-luna              # → run_openai --model gpt-6-luna

generation:
  max_tokens: 32768                  # same budget as gpt_5_4.yaml
  temperature: 1.0                   # gpt-6-luna rejects any other value (incl. 0.0)
