# Qwen3.5-4B with thinking_token_budget=8096.
model:
  hf_id: Qwen/Qwen3.5-4B
  served_name: Qwen3.5-4B-tb8096

server:
  data_parallel_size: 4
  tensor_parallel_size: 1
  max_model_len: 30720
  gpu_memory_utilization: 0.95
